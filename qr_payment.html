<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taco Bell - UPI Payment QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at top, #1e1b4b, #0f172a, #030712); color: #f8fafc; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 36px; border-radius: 24px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5); text-align: center; max-width: 440px; width: 100%; animation: popIn 0.5s ease-out; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .badge { display: inline-block; padding: 6px 14px; background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4); border-radius: 9999px; color: #818cf8; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #a855f7, #6366f1, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .qr-wrap { background: #ffffff; padding: 20px; border-radius: 18px; display: inline-flex; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25); margin-bottom: 20px; }
        .amount { font-size: 32px; font-weight: 800; color: #38bdf8; margin-bottom: 8px; }
        .upi-box { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px; border-radius: 12px; font-size: 14px; color: #cbd5e1; font-family: monospace; letter-spacing: 0.5px; margin-bottom: 20px; }
        .timer { font-size: 13px; color: #f59e0b; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .timer-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Order #TB-5844</div>
        <h1>Taco Bell Payment</h1>
        <p class="sub">Scan QR code with GPay, PhonePe, or Paytm</p>
        <div class="qr-wrap"><div id="qrcode"></div></div>
        <div class="amount">Rs.159/-</div>
        <div class="upi-box">UPI ID: 9311515712@upi</div>
        <div class="timer"><span class="timer-dot"></span> Awaiting Live Confirmation</div>
    </div>
    <script>
        new QRCode(document.getElementById('qrcode'), {
            text: "upi://pay?pa=9311515712@upi&pn=TacoBell&am=159&cu=INR",
            width: 220,
            height: 220,
            colorDark: '#0f172a',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>

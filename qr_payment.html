<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taco Bell - UPI Payment QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        #qrcode {
            display: inline-block;
            margin: 20px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .amount {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
        }
        .upi-id {
            color: #666;
            margin: 10px 0;
            font-size: 14px;
        }
        .instructions {
            color: #999;
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Taco Bell Payment</h1>
        <p class="subtitle">Scan the QR code to complete your payment</p>
        <div id="qrcode"></div>
        <div class="amount">₹338/-</div>
        <div class="upi-id">UPI ID: 9625065557@upi</div>
        <p class="instructions">Scan this QR code with any UPI app (Google Pay, PhonePe, Paytm, etc.)</p>
    </div>
    <script>
        new QRCode(document.getElementById('qrcode'), {
            text: "upi://pay?pa=9625065557@upi&pn=TacoBell&am=338&cu=INR",
            width: 256,
            height: 256,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>

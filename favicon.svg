<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glowing Violet Ring Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Hexagonal / Rounded Shield Background -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#subtleShadow)"/>
  
  <!-- Inner Ambient Glow Ring -->
  <rect x="40" y="40" width="432" height="432" rx="112" fill="none" stroke="url(#violetGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <g filter="url(#goldGlow)">
    <!-- Hotel Service Cloche Bell Handle & Top Dome -->
    <circle cx="256" cy="140" r="16" fill="url(#goldGrad)"/>
    <path d="M 196 195 C 196 160, 316 160, 316 195 Z" fill="url(#goldGrad)"/>
    <rect x="180" y="195" width="152" height="10" rx="5" fill="url(#goldGrad)"/>

    <!-- Taco Shell Arc -->
    <path d="M 140 340 C 140 230, 372 230, 372 340 Z" fill="url(#goldGrad)"/>

    <!-- Taco Filling & Texture details -->
    <!-- Inner Shadow / Fold -->
    <path d="M 160 334 C 160 250, 352 250, 352 334 Z" fill="#0f172a" opacity="0.85"/>
    
    <!-- Lettuce / Filling Waves -->
    <path d="M 175 320 Q 195 285, 215 315 Q 235 280, 256 315 Q 277 280, 297 315 Q 317 285, 337 320" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Gourmet Meat / Cheese Pearls -->
    <circle cx="210" cy="300" r="6" fill="#f59e0b"/>
    <circle cx="256" cy="285" r="7" fill="#fbbf24"/>
    <circle cx="302" cy="300" r="6" fill="#f59e0b"/>
    <circle cx="230" cy="322" r="5" fill="#fcd34d"/>
    <circle cx="280" cy="322" r="5" fill="#fcd34d"/>

    <!-- Base Plate / Arch Accent -->
    <path d="M 120 370 Q 256 395 392 370" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="120" cy="370" r="6" fill="url(#goldGrad)"/>
    <circle cx="392" cy="370" r="6" fill="url(#goldGrad)"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M 370 140 L 375 155 L 390 160 L 375 165 L 370 180 L 365 165 L 350 160 L 365 155 Z" fill="#fef08a"/>
  <path d="M 125 210 L 128 220 L 138 223 L 128 226 L 125 236 L 122 226 L 112 223 L 122 220 Z" fill="#fef08a"/>
</svg>
